# fly.toml app configuration file generated for elset-admin on 2026-06-10T09:36:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'elset-admin'
primary_region = 'ams'

[build]

[env]
  ELSET_DATA_DIR = '/app/data'
  NODE_ENV = 'production'

[[mounts]]
  source = 'elset_admin_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
