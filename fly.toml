app = "elset-admin"
primary_region = "syd"

[build]

[env]
  NODE_ENV = "production"
  ELSET_DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "elset_admin_data"
  destination = "/app/data"
