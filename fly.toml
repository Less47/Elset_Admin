# fly.toml app configuration file generated for elset-admin on 2026-06-12T09:03:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'elset-admin'
primary_region = 'syd'

[build]

[env]
  ELSET_DATA_DIR = '/app/data'
  NODE_ENV = 'production'

[[mounts]]
  source = 'elset_admin_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/api/health'
    timeout = '2s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
